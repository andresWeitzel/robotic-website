<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Circuito boton y LED con Arduino">
  <rect width="960" height="540" fill="#0f1418"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="#182128" stroke="#31404c"/>
  <text x="70" y="85" fill="#3dd6c3" font-family="Segoe UI, Arial" font-size="28" font-weight="700">Circuito: botón + LED</text>
  <text x="70" y="120" fill="#a9b6c0" font-family="Segoe UI, Arial" font-size="16">D8 ’ LED · D2 ’ botón a GND (INPUT_PULLUP)</text>

  <rect x="70" y="160" width="200" height="280" rx="12" fill="#1b6b5a" stroke="#3dd6c3" stroke-width="2"/>
  <text x="110" y="200" fill="#f3f6f8" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Arduino</text>
  <rect x="230" y="240" width="26" height="16" rx="3" fill="#0b1014" stroke="#7af0df"/>
  <text x="185" y="253" fill="#7af0df" font-family="Segoe UI, Arial" font-size="13">D8</text>
  <rect x="230" y="290" width="26" height="16" rx="3" fill="#0b1014" stroke="#9ed8ff"/>
  <text x="185" y="303" fill="#9ed8ff" font-family="Segoe UI, Arial" font-size="13">D2</text>
  <rect x="230" y="360" width="26" height="16" rx="3" fill="#0b1014" stroke="#f0b429"/>
  <text x="175" y="373" fill="#f0b429" font-family="Segoe UI, Arial" font-size="13">GND</text>

  <path d="M256 248 H360" stroke="#7af0df" stroke-width="4"/>
  <rect x="360" y="226" width="120" height="44" rx="8" fill="#212b34" stroke="#9ed8ff" stroke-width="2"/>
  <text x="385" y="254" fill="#9ed8ff" font-family="Segoe UI, Arial" font-size="16" font-weight="700">220 ©</text>
  <path d="M480 248 H560" stroke="#7af0df" stroke-width="4"/>
  <circle cx="590" cy="248" r="18" fill="#3dd6c3"/>
  <text x="570" y="290" fill="#f3f6f8" font-family="Segoe UI, Arial" font-size="15">LED</text>
  <path d="M608 248 H700 V368 H256" stroke="#f0b429" stroke-width="4" fill="none"/>

  <path d="M256 298 H420" stroke="#9ed8ff" stroke-width="4"/>
  <rect x="420" y="270" width="110" height="56" rx="10" fill="#212b34" stroke="#9ed8ff" stroke-width="2"/>
  <text x="445" y="305" fill="#9ed8ff" font-family="Segoe UI, Arial" font-size="16" font-weight="700">BOTÓN</text>
  <path d="M530 298 H620 V368" stroke="#f0b429" stroke-width="4" fill="none"/>

  <text x="70" y="470" fill="#a9b6c0" font-family="Segoe UI, Arial" font-size="14">Al pulsar, D2 lee LOW y el LED en D8 se enciende.</text>
