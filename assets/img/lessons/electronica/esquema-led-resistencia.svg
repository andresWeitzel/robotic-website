<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Circuito LED con resistencia en Arduino">
  <rect width="960" height="540" fill="#0f1418"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="#182128" stroke="#31404c"/>
  <text x="70" y="85" fill="#3dd6c3" font-family="Segoe UI, Arial" font-size="28" font-weight="700">Circuito: LED + resistencia</text>
  <text x="70" y="120" fill="#a9b6c0" font-family="Segoe UI, Arial" font-size="16">Arduino D9 í 220© í LED í GND</text>

  <!-- Arduino board -->
  <rect x="80" y="170" width="220" height="260" rx="12" fill="#1b6b5a" stroke="#3dd6c3" stroke-width="2"/>
  <text x="120" y="205" fill="#f3f6f8" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Arduino</text>
  <text x="120" y="232" fill="#c9f7ef" font-family="Segoe UI, Arial" font-size="14">Uno / Nano</text>
  <rect x="250" y="250" width="28" height="18" rx="3" fill="#0b1014" stroke="#7af0df"/>
  <text x="200" y="264" fill="#7af0df" font-family="Segoe UI, Arial" font-size="13">D9</text>
  <rect x="250" y="330" width="28" height="18" rx="3" fill="#0b1014" stroke="#f0b429"/>
  <text x="195" y="344" fill="#f0b429" font-family="Segoe UI, Arial" font-size="13">GND</text>

  <!-- wires -->
  <path d="M278 259 H360" stroke="#7af0df" stroke-width="4" fill="none"/>
  <path d="M520 259 H610" stroke="#7af0df" stroke-width="4" fill="none"/>
  <path d="M690 300 V348 H278" stroke="#f0b429" stroke-width="4" fill="none"/>

  <!-- resistor -->
  <rect x="360" y="236" width="160" height="46" rx="8" fill="#212b34" stroke="#9ed8ff" stroke-width="2"/>
  <text x="395" y="265" fill="#9ed8ff" font-family="Segoe UI, Arial" font-size="18" font-weight="700">220 ©</text>

  <!-- LED -->
  <circle cx="650" cy="259" r="28" fill="#3dd6c3" opacity="0.35"/>
  <circle cx="650" cy="259" r="16" fill="#3dd6c3"/>
  <text x="630" y="310" fill="#f3f6f8" font-family="Segoe UI, Arial" font-size="16" font-weight="700">LED</text>
  <text x="615" y="332" fill="#a9b6c0" font-family="Segoe UI, Arial" font-size="13">·nodo ê ∑ í c·todo</text>

  <text x="70" y="470" fill="#a9b6c0" font-family="Segoe UI, Arial" font-size="14">Tip: el c·todo (pata corta / plano) va a GND.</text>
</svg>
